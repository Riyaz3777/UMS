<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account - User Management System</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">U</div>
      <span>UMS Platform</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link">Home</a></li>
    </ul>
    <div id="nav-user-pill">
      <a href="/login" class="btn btn-secondary btn-sm">Sign In</a>
    </div>
  </nav>

  <!-- Registration Card -->
  <main class="container auth-container">
    <div class="glass-panel">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join the platform with your user details</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" class="form-input" placeholder="e.g. John Smith" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" class="form-input" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number (Optional)</label>
          <input type="text" id="phone" class="form-input" placeholder="+1 (555) 019-2831">
        </div>

        <div class="form-group">
          <label for="role">Requested Account Role</label>
          <select id="role" class="form-select">
            <option value="User" selected>Normal User</option>
            <option value="Admin">System Administrator</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
          <div id="strength-bar" class="strength-bar"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Already have an account? <a href="/login">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
