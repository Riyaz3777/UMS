<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - User Management System</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">U</div>
      <span>UMS Platform</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link">Home</a></li>
    </ul>
    <div id="nav-user-pill">
      <a href="/register" class="btn btn-secondary btn-sm">Create Account</a>
    </div>
  </nav>

  <!-- Main Login Card -->
  <main class="container auth-container">
    <div class="glass-panel">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your profile and system dashboard</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@ums.com or user@ums.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password">Password</label>
            <a href="/reset-password" style="font-size: 0.78rem;">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="/register">Register here</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
