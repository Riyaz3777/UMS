<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - User Management System</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">U</div>
      <span>UMS Platform</span>
    </a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link">Home</a></li>
    </ul>
    <div id="nav-user-pill">
      <a href="/login" class="btn btn-secondary btn-sm">Sign In</a>
    </div>
  </nav>

  <main class="container auth-container">
    <!-- STEP 1: Request OTP Card -->
    <div id="step-1-card" class="glass-panel">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔑</div>
        <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Forgot Password?</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your email address to receive a 6-digit OTP code</p>
      </div>

      <form id="request-otp-form">
        <div class="form-group">
          <label for="request-email">Registered Email Address</label>
          <input type="email" id="request-email" class="form-input" placeholder="e.g. user@ums.com" required>
        </div>

        <button type="submit" id="request-otp-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Verification OTP</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem;">
        <a href="/login">← Back to Login</a>
      </div>
    </div>

    <!-- STEP 2: Enter OTP & Set New Password Card -->
    <div id="step-2-card" class="glass-panel" style="display: none;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
        <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Set New Password</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Enter the verification OTP code and your new password</p>
      </div>

      <!-- OTP Display Demo Alert -->
      <div id="otp-display-box" style="display:none; background: rgba(99, 102, 241, 0.15); border:1px solid rgba(99, 102, 241, 0.3); border-radius:var(--radius-md); padding:1rem; text-align:center; margin-bottom:1.5rem;"></div>

      <form id="reset-password-form">
        <div class="form-group">
          <label for="reset-email">Email Address</label>
          <input type="email" id="reset-email" class="form-input" required readonly style="opacity:0.7;">
        </div>

        <div class="form-group">
          <label for="reset-otp">6-Digit OTP Code</label>
          <input type="text" id="reset-otp" class="form-input" placeholder="e.g. 123456" maxlength="6" required style="letter-spacing: 0.2em; font-weight:700; font-size:1.1rem; text-align:center;">
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirm-new-password">Confirm New Password</label>
          <input type="password" id="confirm-new-password" class="form-input" placeholder="Re-enter new password" required>
        </div>

        <button type="submit" id="reset-pwd-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
      </form>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/reset.js"></script>
</body>
</html>
